<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ANIVERSE - a community for fans of anime, manhwa and manga.">
<meta name="theme-color" content="#000000">
<title>ANIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
:root{--card:#0e0916;--line:#2a1a45;--purple:#8b3dff;--purple2:#b78bff;--text:#f4eeff;--muted:#9a8bb5;--err:#ff6b8a;color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#2b0f57 0%,#000 65%) no-repeat,#000;color:var(--text);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:22px 16px}
h1{font-size:2.6rem;line-height:1.05;font-weight:800;margin:40px 0 10px;letter-spacing:-.02em}
h1 span{color:var(--purple2)}
h2{font-size:1.5rem;margin:8px 0 14px}
h3{margin:0 0 4px;font-size:1.05rem}
.muted,.sub{color:var(--muted);line-height:1.5;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:600;color:var(--text);background:none}
button:disabled{opacity:.45;cursor:default}
.block{width:100%}
.primary{background:linear-gradient(135deg,#7a2bff,#a259ff);color:#fff}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.small{padding:8px 14px;font-size:.85rem}
.link{background:none;color:var(--purple2);padding:4px 6px;font-size:.8rem}
.danger{color:#ff6b8a}
.google{background:#fff;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
input,textarea,select{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;padding:12px 14px}
textarea{resize:none;height:80px}
.search{margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip{background:#120a1f;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;white-space:nowrap;font-size:.85rem}
.chip.on{background:#2a1152;color:#fff;border-color:var(--purple)}
.gcard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.gcard .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 95%);mask-image:linear-gradient(to bottom,#000 10%,transparent 95%);z-index:0}
.gcard .grow{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.urow .info{min-width:0;flex:1}
.urow .info p{margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.notice{background:#1b0f33;border:1px solid var(--line);color:var(--purple2);border-radius:12px;padding:12px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;border:2px solid var(--purple);background:#150c24 center/cover no-repeat;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--purple2);margin:0 auto}
.center{text-align:center}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px 2px;margin-bottom:12px}
.bubble{background:#150c24;border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-width:85%;align-self:flex-start;word-break:break-word}
.bubble.mine{align-self:flex-end;background:#2a1152;border-color:#4b2a86}
.bubble .acts{display:flex;gap:4px;flex-wrap:wrap}
.meta{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.text{white-space:pre-wrap}
.composer{display:flex;gap:8px}
.composer button{padding:0 18px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#05030a;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;background:none;color:var(--muted);font-size:.8rem;padding:8px 4px;border-radius:10px;text-align:center}
.nav button.on{color:#fff;background:#2a1152}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a1152;border:1px solid var(--purple);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90%;z-index:9}
.empty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>
<body>
<main id="root"></main>
<nav id="nav" class="nav" hidden></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyAg23cKCffPh0CuK22xtKthTrm8lLBTFpA",
  authDomain: "anime-manhwa-room.firebaseapp.com",
  projectId: "anime-manhwa-room",
  appId: "1:847701666837:web:84d6c94e6f11239785f21c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;

// ===== GROUPS =====
const MAX = 50;
const CAT_LABEL = { lookism: "Lookism", anime: "Anime", manhwa: "Manhwa", manga: "Manga" };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const TITLES = {
  anime: ["Naruto","One Piece","Bleach","Dragon Ball Z","Attack on Titan","Demon Slayer","Jujutsu Kaisen","My Hero Academia","Death Note","Fullmetal Alchemist: Brotherhood","One Punch Man","Tokyo Ghoul","Hunter x Hunter","Chainsaw Man","Spy x Family","Solo Leveling","Mob Psycho 100","Code Geass","Steins;Gate","Cowboy Bebop","Sword Art Online","Re:Zero","Overlord","Black Clover","Fairy Tail","Blue Lock","Haikyuu!!","Kaguya-sama: Love Is War","Vinland Saga","Made in Abyss","Frieren","Dr. Stone","Gintama","Fire Force","Dandadan","Oshi no Ko","Bungo Stray Dogs","Tokyo Revengers","Assassination Classroom","Hellsing Ultimate","Psycho-Pass","Parasyte","Akame ga Kill!","The Seven Deadly Sins","Toradora!","Your Lie in April","Violet Evergarden","Erased","JoJo's Bizarre Adventure","Gurren Lagann"],
  manhwa: ["Solo Leveling","Tower of God","The God of High School","Omniscient Reader's Viewpoint","Noblesse","Eleceed","Sweet Home","The Beginning After the End","Tomb Raider King","Star Martial God Technique","Martial Peak","Solo Max-Level Newbie","Nano Machine","Hardcore Leveling Warrior","Doom Breaker","Viral Hunter","Unordinary","Bastard","The Wrong Way to Use Healing Magic","Second Life Ranker","Players","Gosu","Weak Hero","Wind Breaker","Sweet Guy","Cheese in the Trap","True Beauty","Hwarang","Killing Stalking","Bloodline","Overgeared","Return of the Mount Hua Sect","Legend of the Northern Blade","The Greatest Estate Developer","Regressed Demon Lord","Infinite Mage","Boundless Necromancer","Full-Time Magister","Ultimate Mage","Rebirth of the Genius Sword","Regressor of the Fallen Family","Wraith of the Tower","Dungeon Reset","Kill the Hero","Lord of Mysteries","Dr. Frost","Dark Moon","Zombie Pig","Ghost Doctor","Lore Olympus"],
  manga: ["Berserk","Vagabond","Monster","Oyasumi Punpun","Kingdom","Blame!","Chihayafuru","Mushishi","Yotsuba&!","Dorohedoro"]
};
const GROUPS = [
  { id: "lookism-1", name: "Lookism #1", cat: "lookism" },
  { id: "lookism-2", name: "Lookism #2", cat: "lookism" },
  { id: "lookism-3", name: "Lookism #3", cat: "lookism" },
  ...Object.entries(TITLES).flatMap(([cat, names]) => names.map(n => ({ id: cat + "-" + slug(n), name: n, cat })))
];
const CATS = [["all", "All"], ...Object.entries(CAT_LABEL)];

// ===== STATE & HELPERS =====
const S = { user: null, profile: null, admin: false, tab: "", room: null, dm: null, q: "", lastSearch: "",
  cat: "all", groups: {}, joined: new Set(), blocked: new Set(), blockedDocs: [], chatDocs: [],
  pendingPhoto: null, authUnsub: [], viewUnsub: [], dataOn: false };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => t && t.toMillis ? new Date(t.toMillis()).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const initial = p => esc(((p.username || "?")[0] || "?").toUpperCase());
const avatarBg = p => p ? `style="background-image:url('${p}')"` : "";
const put = html => { document.getElementById("root").innerHTML = html; };
const setList = html => { const el = document.getElementById("list"); if (el) el.innerHTML = html; };
const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
function listen(q, cb) { S.viewUnsub.push(q.onSnapshot(cb, e => toast("Error: " + (e.code || e.message)))); }
function clearView() { S.viewUnsub.forEach(f => f()); S.viewUnsub = []; }
const dmId = uid => [S.user.uid, uid].sort().join("_");
const otherOf = c => c.participants.find(p => p !== S.user.uid);

const G_SVG = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>`;

function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 160, c = document.createElement("canvas"); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read this photo.")); };
    img.src = url;
  });
}

// ===== AUTH & DATA =====
auth.onAuthStateChanged(async user => {
  S.authUnsub.forEach(f => f()); S.authUnsub = []; S.dataOn = false;
  S.groups = {}; S.joined = new Set(); S.blocked = new Set(); S.blockedDocs = []; S.chatDocs = [];
  clearView();
  S.user = user;
  if (!user) return renderLogin();
  try {
    const [p, a] = await Promise.all([
      db.collection("users").doc(user.uid).get(),
      db.collection("admins").doc(user.uid).get()
    ]);
    S.profile = p.exists ? p.data() : null;
    S.admin = a.exists;
  } catch (e) { return put(`<div class="card"><p>Could not load your account (${esc(e.code || e.message)}).</p></div>`); }
  if (!S.profile) return renderSetup(false);
  startData();
  go("groups");
});

function startData() {
  if (S.dataOn) return;
  S.dataOn = true;
  S.authUnsub.push(db.collection("groups").onSnapshot(snap => {
    S.groups = {};
    snap.docs.forEach(d => { S.groups[d.id] = d.data(); });
    if (S.tab === "groups") renderGroupList();
  }, e => toast("Groups error: " + (e.code || e.message))));
  S.authUnsub.push(db.collection("users").doc(S.user.uid).collection("groups").onSnapshot(snap => {
    S.joined = new Set(snap.docs.map(d => d.id));
    if (S.tab === "groups") renderGroupList();
    if (S.tab === "room" || S.tab === "members") go(S.tab);
  }, () => {}));
  S.authUnsub.push(db.collection("users").doc(S.user.uid).collection("blocked").onSnapshot(snap => {
    S.blockedDocs = snap.docs.map(d => ({ id: d.id, username: d.data().username || "User" }));
    S.blocked = new Set(S.blockedDocs.map(b => b.id));
    if (S.tab === "chats") renderChats();
    else if (S.tab === "profile") renderBlockedList();
    else if (S.tab === "search") runSearch(S.lastSearch);
    else if (S.tab === "dm" || S.tab === "room") go(S.tab);
  }, () => {}));
}

// ===== LOGIN & PROFILE SETUP =====
function renderLogin() {
  S.tab = "login"; setNav(false);
  put(`<h1>ANI<span>VERSE</span></h1>
    <p class="sub">A community for fans of anime, manhwa and manga. Lookism, Naruto, Jujutsu Kaisen, Solo Leveling and more.</p>
    <div class="card"><button class="google block" data-act="login">${G_SVG}Continue with Google</button></div>`);
}

function renderSetup(editing) {
  S.tab = editing ? "edit" : "setup"; clearView(); setNav(false);
  S.pendingPhoto = null;
  const p = S.profile || {};
  put(`<h1 style="font-size:2rem;margin-top:30px">${editing ? "Edit profile" : "Create your profile"}</h1>
    <form class="card stack" data-form="setup">
      <div class="avatar" id="avatarPrev" ${avatarBg(p.photo)}>${p.photo ? "" : initial(p)}</div>
      <label class="link center">Choose photo<input id="photoIn" type="file" accept="image/*" hidden></label>
      <label>Username<input name="username" value="${esc(p.username || "")}" placeholder="Enter any name" autocomplete="off"></label>
      <label>Bio<textarea name="bio" maxlength="150" placeholder="Favourite anime or manhwa?">${esc(p.bio || "")}</textarea></label>
      <button class="primary block">Save profile</button>
      ${editing ? `<button type="button" class="ghost block" data-act="go" data-id="profile">Cancel</button>` : ""}
    </form>`);
}

async function saveSetup(form) {
  const fd = new FormData(form);
  const username = String(fd.get("username") || "").trim();
  if (!username) throw new Error("Username cannot be empty.");
  const bio = String(fd.get("bio") || "").trim().slice(0, 150);
  const photo = S.pendingPhoto || (S.profile && S.profile.photo) || "";
  const data = { username, usernameLower: username.toLowerCase(), bio, updatedAt: FV.serverTimestamp() };
  if (photo) data.photo = photo;
  await db.collection("users").doc(S.user.uid).set(data, { merge: true });
  S.profile = { ...(S.profile || {}), username, usernameLower: username.toLowerCase(), bio, photo };
  toast("Profile saved");
  startData();
  go("groups");
}

// ===== NAVIGATION =====
const TABS = [["groups", "Groups"], ["chats", "Chats"], ["search", "Search"], ["profile", "Profile"], ["admin", "Admin"]];
function setNav(on) {
  const nav = document.getElementById("nav");
  nav.hidden = !on;
  if (!on) { nav.innerHTML = ""; return; }
  const map = { room: "groups", members: "groups", dm: "chats", edit: "profile" };
  const active = map[S.tab] || S.tab;
  nav.innerHTML = TABS.filter(([id]) => id !== "admin" || S.admin)
    .map(([id, label]) => `<button data-act="go" data-id="${id}" class="${active === id ? "on" : ""}">${label}</button>`).join("");
}
const VIEWS = { groups: viewGroups, chats: viewChats, search: viewSearch, profile: viewProfile,
  admin: viewAdmin, room: viewRoom, dm: viewDm, members: viewMembers };
function go(tab, arg) {
  if (tab === "admin" && !S.admin) tab = "groups";
  if (tab === "room" && arg) S.room = arg;
  S.tab = tab; clearView(); setNav(true); window.scrollTo(0, 0);
  VIEWS[tab]();
}

// ===== GROUPS LIST =====
function groupCard(g) {
  const d = S.groups[g.id], exists = !!d, count = (d && d.memberCount) || 0;
  const joined = S.joined.has(g.id), full = count >= MAX;
  const bg = d && d.poster ? `<div class="bg" style="background-image:url('${esc(d.poster)}')"></div>` : "";
  let btn;
  if (!exists) btn = `<button class="ghost small" disabled>Coming soon</button>`;
  else if (joined) btn = `<button class="primary small" data-act="open" data-id="${g.id}">Open</button>`;
  else if (full) btn = `<button class="ghost small" disabled>Full</button>`;
  else btn = `<button class="primary small" data-act="join" data-id="${g.id}">Join</button>`;
  return `<article class="gcard">${bg}<div class="grow">
    <div><h3>${esc(g.name)}</h3><small class="muted">${CAT_LABEL[g.cat]} · ${count}/${MAX} members</small></div>
    ${btn}</div></article>`;
}
function viewGroups() {
  put(`<div class="hdr"><h2>Groups</h2><span class="muted">Max ${MAX} per group</span></div>
    <input class="search" id="gq" placeholder="Search groups" value="${esc(S.q)}" autocomplete="off">
    <div class="chips">${CATS.map(([id, l]) => `<button class="chip" data-act="cat" data-id="${id}">${l}</button>`).join("")}</div>
    <div id="glist"></div>`);
  renderGroupList();
}
function renderGroupList() {
  const el = document.getElementById("glist"); if (!el) return;
  const list = GROUPS.filter(g => (S.cat === "all" || g.cat === S.cat) && g.name.toLowerCase().includes(S.q));
  el.innerHTML = list.map(groupCard).join("") || `<p class="empty">No groups found.</p>`;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.id === S.cat));
}

// ===== JOIN / LEAVE / REMOVE =====
async function join(gid) {
  const uid = S.user.uid;
  const gRef = db.collection("groups").doc(gid);
  const mRef = gRef.collection("members").doc(uid);
  const uRef = db.collection("users").doc(uid).collection("groups").doc(gid);
  await db.runTransaction(async t => {
    const g = await t.get(gRef), m = await t.get(mRef);
    if (!g.exists) throw new Error("This group is not open yet. Admin needs to create groups.");
    if (m.exists) return;
    const n = g.data().memberCount || 0;
    if (n >= MAX) throw new Error("This group is full (50 members).");
    t.set(mRef, { uid, username: S.profile.username, joinedAt: FV.serverTimestamp() });
    t.set(uRef, { joinedAt: FV.serverTimestamp() });
    t.update(gRef, { memberCount: n + 1 });
  });
  toast("Joined!");
}
async function leave(gid) {
  const uid = S.user.uid;
  const gRef = db.collection("groups").doc(gid);
  const mRef = gRef.collection("members").doc(uid);
  const uRef = db.collection("users").doc(uid).collection("groups").doc(gid);
  await db.runTransaction(async t => {
    const g = await t.get(gRef), m = await t.get(mRef);
    if (!m.exists) return;
    t.delete(mRef);
    t.delete(uRef);
    t.update(gRef, { memberCount: Math.max(0, (g.data().memberCount || 0) - 1) });
  });
  toast("You left the group");
}
async function removeMember(gid, uid) {
  if (!confirm("Remove this member from the group?")) return;
  const gRef = db.collection("groups").doc(gid);
  const mRef = gRef.collection("members").doc(uid);
  const uRef = db.collection("users").doc(uid).collection("groups").doc(gid);
  await db.runTransaction(async t => {
    const g = await t.get(gRef), m = await t.get(mRef);
    if (!m.exists) return;
    t.delete(mRef);
    t.delete(uRef);
    t.update(gRef, { memberCount: Math.max(0, (g.data().memberCount || 0) - 1) });
  });
  toast("Member removed");
}

// ===== GROUP ROOM (CHAT) =====
function viewRoom() {
  const gid = S.room, g = GROUPS.find(x => x.id === gid);
  if (!g) return go("groups");
  if (!S.joined.has(gid)) {
    put(`<div class="hdr"><button class="ghost small" data-act="go" data-id="groups">← Back</button></div>
      <h2>${esc(g.name)}</h2>
      <div class="card center"><p class="muted">Join this group to see messages and chat.</p>
      <button class="primary block" data-act="join" data-id="${gid}">Join group</button></div>`);
    return;
  }
  put(`<div class="hdr"><button class="ghost small" data-act="go" data-id="groups">← Back</button>
      <div style="display:flex;gap:6px"><button class="ghost small" data-act="members">Members</button>
      <button class="ghost small" data-act="leave" data-id="${gid}">Leave</button></div></div>
    <h2>${esc(g.name)}</h2>
    <div id="msgs" class="chat"></div>
    <form class="composer" data-form="msg" data-id="${gid}">
      <input name="text" maxlength="500" placeholder="Write a message" autocomplete="off">
      <button class="primary">Send</button>
    </form>`);
  const path = `groups/${gid}/messages`;
  listen(db.collection("groups").doc(gid).collection("messages").orderBy("createdAt", "asc").limitToLast(100), snap => {
    const el = document.getElementById("msgs"); if (!el) return;
    el.innerHTML = snap.docs.map(d => msgHTML(d, path)).join("") || `<p class="empty">No messages yet. Say hi!</p>`;
    el.scrollTop = el.scrollHeight;
  });
}

function viewMembers() {
  const gid = S.room, g = GROUPS.find(x => x.id === gid) || { name: "Group" };
  put(`<div class="hdr"><button class="ghost small" data-act="go" data-id="room">← Back</button></div>
    <h2>${esc(g.name)} members</h2>
    <p class="muted">${S.admin ? "As admin you can remove members." : "Members of this group."}</p>
    <div id="list" class="stack"></div>`);
  listen(db.collection("groups").doc(gid).collection("members"), snap => {
    setList(snap.docs.map(d => {
      const m = d.data(), me = d.id === S.user.uid;
      return `<div class="urow"><span>@${esc(m.username || "User")}${me ? " (you)" : ""}</span>
        ${S.admin && !me ? `<button class="link danger" data-act="remove" data-id="${d.id}" data-gid="${gid}">Remove</button>` : ""}</div>`;
    }).join("") || `<p class="empty">No members yet.</p>`);
  });
}

// ===== MESSAGES (shared by group + DM) =====
function msgHTML(d, path) {
  const m = d.data(), mine = m.uid === S.user.uid;
  if (!mine && S.blocked.has(m.uid)) return "";
  const acts = [];
  if (mine || (S.admin && path.startsWith("groups/")))
    acts.push(`<button class="link danger" data-act="delMsg" data-path="${path}/${d.id}">Delete</button>`);
  if (!mine)
    acts.push(`<button class="link" data-act="block" data-id="${esc(m.uid)}" data-name="${esc(m.username)}">Block</button>`);
  return `<div class="bubble${mine ? " mine" : ""}"><div class="meta"><b>${esc(m.username)}</b> · ${when(m.createdAt)}</div>
    <div class="text">${esc(m.text)}</div><div class="acts">${acts.join("")}</div></div>`;
}
async function sendGroup(gid, text) {
  await db.collection("groups").doc(gid).collection("messages").add({
    uid: S.user.uid, username: S.profile.username, text: text.slice(0, 500), createdAt: FV.serverTimestamp()
  });
}

// ===== CHATS (DM LIST) =====
function viewChats() {
  put(`<h2>Chats</h2><div id="list" class="stack"></div>`);
  listen(db.collection("dms").where("participants", "array-contains", S.user.uid), snap => {
    S.chatDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderChats();
  });
}
function renderChats() {
  const chats = (S.chatDocs || [])
    .filter(c => c.lastAt && !S.blocked.has(otherOf(c)))
    .sort((a, b) => b.lastAt.toMillis() - a.lastAt.toMillis());
  setList(chats.length ? chats.map(c => {
    const o = otherOf(c), n = (c.names && c.names[o]) || "User";
    return `<button class="row-btn" data-act="dm" data-id="${o}" data-name="${esc(n)}"><b>@${esc(n)}</b><small class="muted">${esc(c.last || "")}</small></button>`;
  }).join("") : `<p class="empty">No chats yet. Search a user and tap Message.</p>`);
}

async function openDm(uid, name) {
  if (uid === S.user.uid) return;
  if (S.blocked.has(uid)) throw new Error("Unblock this user to chat.");
  const id = dmId(uid);
  await db.collection("dms").doc(id).set({
    participants: [S.user.uid, uid].sort(),
    names: { [S.user.uid]: S.profile.username, [uid]: name }
  }, { merge: true });
  S.dm = { id, otherUid: uid, name };
  go("dm");
}

function viewDm() {
  const { id, otherUid, name } = S.dm;
  const blocked = S.blocked.has(otherUid);
  put(`<div class="hdr"><button class="ghost small" data-act="go" data-id="chats">← Back</button>
      ${blocked
        ? `<button class="ghost small" data-act="unblock" data-id="${otherUid}">Unblock</button>`
        : `<button class="link danger" data-act="block" data-id="${otherUid}" data-name="${esc(name)}">Block</button>`}
    </div>
    <h2>@${esc(name)}</h2>
    <div id="msgs" class="chat"></div>
    ${blocked
      ? `<div class="notice">You blocked this user. Unblock to chat again.</div>`
      : `<form class="composer" data-form="dm" data-id="${id}">
          <input name="text" maxlength="500" placeholder="Write a message" autocomplete="off">
          <button class="primary">Send</button></form>`}`);
  const path = `dms/${id}/messages`;
  listen(db.collection("dms").doc(id).collection("messages").orderBy("createdAt", "asc").limitToLast(100), snap => {
    const el = document.getElementById("msgs"); if (!el) return;
    el.innerHTML = snap.docs.map(d => msgHTML(d, path)).join("") || `<p class="empty">No messages yet. Say hi!</p>`;
    el.scrollTop = el.scrollHeight;
  });
}

async function sendDm(text) {
  const { id, otherUid } = S.dm;
  if (S.blocked.has(otherUid)) throw new Error("You blocked this user.");
  const ref = db.collection("dms").doc(id);
  await ref.collection("messages").add({
    uid: S.user.uid, username: S.profile.username, text: text.slice(0, 500), createdAt: FV.serverTimestamp()
  });
  await ref.update({ last: text.slice(0, 60), lastAt: FV.serverTimestamp() });
}

// ===== SEARCH =====
function viewSearch() {
  put(`<h2>Find users</h2>
    <form class="composer search" data-form="search">
      <input name="q" value="${esc(S.lastSearch)}" placeholder="Search by username" autocomplete="off">
      <button class="primary">Search</button>
    </form>
    <div id="list" class="stack" style="margin-top:14px"></div>`);
  if (S.lastSearch) runSearch(S.lastSearch);
}
async function runSearch(raw) {
  const text = String(raw || "").trim();
  S.lastSearch = text;
  const q = text.toLowerCase();
  if (!q) return setList(`<p class="empty">Type a username to search.</p>`);
  setList(`<p class="empty">Searching...</p>`);
  try {
    const snap = await db.collection("users").orderBy("usernameLower").startAt(q).endAt(q + "\uf8ff").limit(20).get();
    const rows = snap.docs.filter(d => d.id !== S.user.uid).map(d => {
      const u = d.data(), b = S.blocked.has(d.id);
      return `<div class="urow"><div class="info"><b>@${esc(u.username)}</b><p class="muted">${esc(u.bio || "")}</p></div>
        <div class="col">
          ${b ? "" : `<button class="primary small" data-act="dm" data-id="${d.id}" data-name="${esc(u.username)}">Message</button>`}
          <button class="link ${b ? "" : "danger"}" data-act="${b ? "unblock" : "block"}" data-id="${d.id}" data-name="${esc(u.username)}">${b ? "Unblock" : "Block"}</button>
        </div></div>`;
    }).join("");
    setList(rows || `<p class="empty">No users found.</p>`);
  } catch (e) { setList(`<p class="empty">Search failed: ${esc(e.code || e.message)}</p>`); }
}

// ===== BLOCK / UNBLOCK =====
async function blockUser(uid, name) {
  if (!uid || uid === S.user.uid) return;
  await db.collection("users").doc(S.user.uid).collection("blocked").doc(uid)
    .set({ username: name || "User", createdAt: FV.serverTimestamp() });
  toast("User blocked");
}
async function unblockUser(uid) {
  await db.collection("users").doc(S.user.uid).collection("blocked").doc(uid).delete();
  toast("User unblocked");
}

// ===== PROFILE =====
function viewProfile() {
  const p = S.profile;
  put(`<h2>Your profile</h2>
    <div class="card center">
      <div class="avatar" ${avatarBg(p.photo)}>${p.photo ? "" : initial(p)}</div>
      <h3 style="margin-top:12px">@${esc(p.username)}</h3>
      <p class="muted">${esc(p.bio || "No bio yet.")}</p>
      <p class="muted">Groups joined: ${S.joined.size}</p>
      <button class="primary block" data-act="edit">Edit profile</button>
      <button class="ghost block" data-act="logout" style="margin-top:10px">Log out</button>
    </div>
    <h3 style="margin:18px 0 10px">Blocked users</h3>
    <div id="blist" class="stack"></div>`);
  renderBlockedList();
}
function renderBlockedList() {
  const el = document.getElementById("blist"); if (!el) return;
  el.innerHTML = S.blockedDocs.map(b =>
    `<div class="urow"><span>@${esc(b.username)}</span><button class="ghost small" data-act="unblock" data-id="${b.id}">Unblock</button></div>`
  ).join("") || `<p class="empty">No blocked users.</p>`;
}

// ===== ADMIN =====
function viewAdmin() {
  const opts = GROUPS.map(g => `<option value="${g.id}">${esc(g.name)} (${CAT_LABEL[g.cat]})</option>`).join("");
  put(`<h2>Admin panel</h2>
    <div class="card stack"><h3>Setup groups</h3>
      <p class="muted">Creates all ${GROUPS.length} groups in the database. Safe to run again.</p>
      <button class="primary block" data-act="seed">Create / refresh all groups</button></div>
    <form class="card stack" data-form="poster"><h3>Set group poster</h3>
      <p class="muted">Paste an image link (https://...). It shows faded behind the group card.</p>
      <select name="gid">${opts}</select>
      <input name="poster" type="url" placeholder="https://... image link" required>
      <button class="primary block">Save poster</button>
    </form>`);
}
async function seedGroups() {
  const batch = db.batch();
  GROUPS.forEach(g => batch.set(db.collection("groups").doc(g.id), { name: g.name, cat: g.cat }, { merge: true }));
  await batch.commit();
  toast("Groups are ready");
}

// ===== EVENTS =====
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const d = b.dataset;
  try {
    switch (d.act) {
      case "login": await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); break;
      case "logout": await auth.signOut(); break;
      case "go": go(d.id); break;
      case "cat": S.cat = d.id; renderGroupList(); break;
      case "open": go("room", d.id); break;
      case "join": await join(d.id); if (S.tab === "room") go("room"); break;
      case "leave": await leave(d.id); go("groups"); break;
      case "members": go("members"); break;
      case "remove": await removeMember(d.gid, d.id); break;
      case "edit": renderSetup(true); break;
      case "dm": await openDm(d.id, d.name); break;
      case "block": await blockUser(d.id, d.name); break;
      case "unblock": await unblockUser(d.id); break;
      case "delMsg":
        if (confirm("Delete this message?")) await db.doc(d.path).delete();
        break;
      case "seed": await seedGroups(); break;
    }
  } catch (err) { toast(err.message || err.code || "Something went wrong"); }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.form;
  try {
    if (kind === "setup") await saveSetup(form);
    if (kind === "search") await runSearch(String(new FormData(form).get("q") || ""));
    if (kind === "msg" || kind === "dm") {
      const text = String(new FormData(form).get("text") || "").trim();
      if (!text) return;
      if (kind === "msg") await sendGroup(form.dataset.id, text);
      else await sendDm(text);
      form.reset();
    }
    if (kind === "poster") {
      const fd = new FormData(form), gid = String(fd.get("gid")), poster = String(fd.get("poster") || "").trim();
      if (!/^https:\/\//.test(poster)) throw new Error("Poster link must start with https://");
      await db.collection("groups").doc(gid).set({ poster }, { merge: true });
      form.reset(); toast("Poster saved");
    }
  } catch (err) { toast(err.message || err.code || "Something went wrong"); }
});

document.addEventListener("input", e => {
  if (e.target.id === "gq") { S.q = e.target.value.trim().toLowerCase(); renderGroupList(); }
});

document.addEventListener("change", async e => {
  if (e.target.id !== "photoIn" || !e.target.files[0]) return;
  try {
    S.pendingPhoto = await resizePhoto(e.target.files[0]);
    const a = document.getElementById("avatarPrev");
    a.style.backgroundImage = `url('${S.pendingPhoto}')`;
    a.textContent = "";
  } catch (err) { toast(err.message); }
});
</script>
</body>
</html>
